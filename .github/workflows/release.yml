name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing tag and manifest version to release
        required: true
        type: string
      prerelease:
        description: Mark the GitHub release as a prerelease
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install pnpm 11
        run: npm install --global pnpm@11
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - name: Verify release version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: node -e "const manifest = require('./manifest.json'); if (manifest.version !== process.env.RELEASE_VERSION) throw new Error('Tag and manifest versions differ')"
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          args=(--title "$RELEASE_VERSION" --generate-notes)
          if [[ "$PRERELEASE" == "true" ]]; then args+=(--prerelease); fi
          gh release create "$RELEASE_VERSION" main.js manifest.json styles.css "${args[@]}"
